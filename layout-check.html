<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>給排水設備HP・表示確認</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font:14px/1.6 sans-serif;background:#e8edf2;color:#17324a}h1{margin:0 0 10px;font-size:20px}.controls{display:flex;gap:20px;align-items:center;margin-bottom:14px}button,select{font:inherit;padding:5px 10px}main{display:flex;gap:20px;align-items:start}article{flex:none}header{display:flex;gap:10px;align-items:center;margin-bottom:8px}iframe{display:block;height:750px;border:0;background:#fff;box-shadow:0 2px 12px #0002}pre{white-space:pre-wrap;background:#fff;padding:15px}#test-frame{position:fixed;left:-10000px;top:0;visibility:hidden;height:800px;box-shadow:none}</style>
<h1>給排水設備HP・スマホ幅の表示確認</h1><div class="controls"><label>ページ <select id="page"><option value="index.html">トップ</option><option value="about.html">会社概要</option><option value="service.html">サービス</option><option value="business.html">事業内容</option><option value="contact.html">お問い合わせ</option></select></label><button id="audit">全ページの幅を確認</button><span id="status">表示確認用の一時ページ</span></div>
<main><article><header>320px<button class="jump" data-index="0">信頼の見出し</button></header><iframe title="320pxの表示" width="320" src="index.html"></iframe></article><article><header>390px<button class="jump" data-index="1">信頼の見出し</button></header><iframe title="390pxの表示" width="390" src="index.html"></iframe></article><article><header>430px<button class="jump" data-index="2">信頼の見出し</button></header><iframe title="430pxの表示" width="430" src="index.html"></iframe></article></main><pre id="results">確認待ち</pre><iframe id="test-frame" title="幅検証用フレーム"></iframe>
<script>
const views=[...document.querySelectorAll('main iframe')];
document.querySelector('#page').addEventListener('change',e=>views.forEach(f=>f.src=e.target.value));
document.querySelectorAll('.jump').forEach(b=>b.addEventListener('click',()=>{const f=views[Number(b.dataset.index)];const target=f.contentDocument.querySelector('.editorial-intro');if(target)target.scrollIntoView({block:'start'});}));
function inspect(f){
 const d=f.contentDocument,w=f.contentWindow,limit=d.documentElement.clientWidth,bad=[];
 for(const e of d.querySelectorAll('h1,h2,h3,p,blockquote,.jp-phrase,.jp-part,dt,dd,aside,label,strong,.chapter')){
  const box=e.getBoundingClientRect();if(!box.width||!box.height)continue;
  const range=d.createRange();range.selectNodeContents(e);
  const rects=[...range.getClientRects()];
  if(box.left<-.75||box.right>limit+.75||e.scrollWidth>e.clientWidth+1||rects.some(r=>r.width>0&&(r.left<-.75||r.right>limit+.75)))bad.push(e.textContent.trim().slice(0,100));
 }
 return {viewport:w.innerWidth,documentWidth:d.documentElement.scrollWidth,overflow:[...new Set(bad)]};
}
document.querySelector('#audit').addEventListener('click',async e=>{
 e.target.disabled=true;const status=document.querySelector('#status'),out=document.querySelector('#results'),f=document.querySelector('#test-frame'),results=[];
 for(const page of ['index.html','about.html','service.html','business.html','contact.html']){
  for(const width of [320,375,390,430,760,980,1440]){
   status.textContent=page+' / '+width+'px';
   f.style.width=width+'px';
   await new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=reject;f.src=page;});
   await f.contentDocument.fonts.ready;
   await new Promise(r=>f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(r)));
   const result=inspect(f);results.push({page,width,...result});
   if(width===320){
    const menu=f.contentDocument.querySelector('.menu-button');
    menu.click();const opened=inspect(f);results.push({page,width,menuOpen:true,...opened});
   }
   out.textContent=JSON.stringify(results,null,2);
  }
 }
 status.textContent=results.every(r=>!r.overflow.length&&r.documentWidth<=r.viewport)?'全40条件で横はみ出しなし':'要確認の箇所があります';e.target.disabled=false;
});
</script></html>
